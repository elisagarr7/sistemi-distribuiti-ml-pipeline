apiVersion: "nuclio.io/v1"
kind: NuclioFunction

metadata:
  name: inference-faas
  namespace: nuclio
  labels:
    nuclio.io/project-name: sdcc-ml-pipeline

spec:
  description: "API HTTP per classificazione real-time dei prodotti"

  runtime: python:3.12
  handler: main:handler

  env:
    - name: MINIO_ENDPOINT
      value: minio:9000

  platform:
    attributes:
      network: sdcc-network

  build:
    commands:
      - "python -m pip install scikit-learn==1.9.1 joblib==1.6.0 minio==7.2.20"

  triggers:
    http:
      kind: http
      attributes:
        port: 8085