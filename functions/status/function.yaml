apiVersion: nuclio.io/v1
kind: NuclioFunction

metadata:
  name: status-faas
  namespace: nuclio
  labels:
    nuclio.io/project-name: sdcc-ml-pipeline

spec:
  runtime: python:3.12
  handler: main:handler

  build:
    commands:
      - "python -m pip install minio==7.2.20"

  env:
    - name: MINIO_ENDPOINT
      value: minio:9000

  triggers:
    http:
      kind: http
      attributes:
        port: 8086

  platform:
    attributes:
      network: sdcc-network